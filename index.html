<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>暗礁</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1014'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%236b5a24' stroke='%238a7430' stroke-width='2'/%3E%3Cpath d='M10 21 L15 9 L18 20 L22 8' fill='none' stroke='%230b1014' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1014;
        --ink: #c8d2d8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Songti SC', 'SimSun', 'Noto Serif CJK SC', 'Source Han Serif SC', serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      #game {
        width: 100%;
        height: 100%;
        /* 移动端地址栏收起/展开时 100% 不跟着变，dvh 才会 */
        height: 100dvh;
        /* 这里不用 flex 居中：Phaser 的 autoCenter: CENTER_BOTH 已经会给画布
           加 margin 把它摆正，再用 flex 居中就是居中两次 —— 在 720×1280 的窗口里
           画布正好铺满、看不出来，一换到手机尺寸就被多推了约 38px，上下留白不对称。 */
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* 加载态：Phaser 接管前的占位 */
      #boot-hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.6em;
        font-size: 14px;
        color: #4a5b66;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #boot-hint.gone {
        opacity: 0;
      }
      /*
       * 横屏提示（C7）。
       *
       * 游戏是 720×1280 的竖屏舞台，Scale.FIT 遇到横屏会把它压成中间一条
       * 很窄的画面 —— 在手机上大约只有屏幕高度的三分之一，字小到看不清。
       * 这里挡一层让玩家把手机转回来，比让他自己琢磨"为什么这么小"要好。
       *
       * 用 max-height 而不是 orientation 单条件：桌面浏览器窗口几乎都是横的，
       * 只按 orientation 挡，会把 1440×900 的桌面用户也一起挡住。
       */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        text-align: center;
      }
      #rotate-hint .glyph {
        font-size: 44px;
        line-height: 1;
        color: #6b7c88;
        animation: rotate-tilt 1.6s ease-in-out infinite;
      }
      #rotate-hint .title {
        font-size: 20px;
        letter-spacing: 0.24em;
        color: var(--ink);
      }
      #rotate-hint .sub {
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #55646e;
      }
      @keyframes rotate-tilt {
        0%,
        40% {
          transform: rotate(0deg);
        }
        70%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: landscape) and (max-height: 560px) {
        #rotate-hint {
          display: flex;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate-hint .glyph {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-hint">暗 礁</div>
    <div id="rotate-hint">
      <div class="glyph">▯</div>
      <div class="title">请把手机竖过来</div>
      <div class="sub">《暗礁》是竖屏游戏</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
